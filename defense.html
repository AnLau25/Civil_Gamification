<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Watershed Defense: build the treatment train that removes each contaminant before it reaches the river.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Watershed Defense | FE Arcade</title>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/quiz.css">
<link rel="stylesheet" href="css/games/defense.css">

<script src="js/core/protocol-check.js"></script>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <a class="back" href="index.html" aria-label="Quit to the main menu">&#8249;<span class="bktxt">Quit</span></a>
    <div class="ttl">Watershed Defense</div>
    <button class="hlp" id="help" type="button" aria-label="How to play">?</button>
    <button class="snd" id="sound" type="button"></button>
    <button class="who" id="who" type="button"></button>
  </header>

  <div class="stage" id="stage">
    <canvas id="game" class="gamecanvas" aria-label="Watershed tower defense game"></canvas>

    <div class="hud">
      <div class="grp">
        <div class="pill good"><span class="k">Budget</span><span class="v" id="budgetEl">$0</span></div>
        <div class="pill"><span class="k">Wave</span><span class="v" id="waveEl">0</span></div>
      </div>
      <div class="grp">
        <div class="pill right bad wq">
          <span class="k">Water quality</span><span class="v" id="wqEl">100</span>
          <div class="metre"><i id="wqBar" style="width:100%"></i></div>
        </div>
      </div>
    </div>

    <div id="wavebar" class="hidden">
      <button class="wbtn go" id="nextWave" type="button">Start wave</button>
      <button class="wbtn" id="speedBtn" type="button">1x</button>
    </div>

    <div id="twpanel" class="hidden">
      <div class="tphead">
        <img class="tpicon" id="tpIcon" alt="" width="34" height="34">
        <div class="tpinfo">
          <div class="nm" id="tpName"></div>
          <div class="dt" id="tpDetail"></div>
        </div>
        <button class="tpsell" id="tpSell" type="button">Sell</button>
        <button class="tpclose" id="tpClose" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="pth" id="pathA"></div>
      <div class="pth" id="pathB"></div>
      <p class="tpdsc" id="tpDsc"></p>
    </div>

    <div id="palette"></div>

    <div class="overlay" id="ovl"><div class="card wide" id="ovlCard"></div></div>
  </div>
</div>

<div id="fileProtocolWarning"></div>

<script type="module" src="js/games/defense/main.js"></script>
</body>
</html>
